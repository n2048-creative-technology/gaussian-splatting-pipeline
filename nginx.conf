# nginx config inside the gs-gallery container.
#
# Deployed behind the host nginx's path-based reverse proxy
# (home.n2048.com/gaussian-splatting/ -> 127.0.0.1:<port>/ , trailing
# slash on both sides strips the prefix — see
# /etc/nginx/routes.d/gaussian-splatting.conf on the host), so this
# config serves everything at "/" and knows nothing about the public
# path prefix.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # include (not replace) the default MIME table so .html/.js/.css
    # keep their correct types — a bare `types {}` block REPLACES the
    # whole table instead of extending it, which previously made nginx
    # fall back to application/octet-stream for *everything* including
    # index.html, triggering a browser download prompt instead of
    # rendering the page.
    include /etc/nginx/mime.types;
    types {
        # .ksplat is a custom binary format (GaussianSplats3D) with no
        # built-in MIME mapping -- add it on top of the default table.
        application/octet-stream ksplat;
    }

    # Splat binaries and the vendored JS libs are content-addressed by
    # filename (new splat = new file via add_splat.sh), so they're safe
    # to cache aggressively.
    location ~* \.(ksplat|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # manifest.json changes whenever a new splat is registered — never
    # cache it, so the gallery picks up new entries on next page load.
    location = /manifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
